name: Feature request
description: Suggest an addition or a change to the driver
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case, not only the API you would like to see.
      placeholder: I need to stream data at 1 kHz and polling wastes CPU, so ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API shape, register support, or behaviour you have in mind
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - New feature in the driver
        - New port or example
        - Documentation
        - Build system or CI
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
        - label: I can test it on real hardware
